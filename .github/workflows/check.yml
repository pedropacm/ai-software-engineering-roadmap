name: Validate course and lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation tool
        run: pip install -r requirements-docs.txt
      - name: Validate curriculum integrity
        run: python3 scripts/validate_curriculum.py
      - name: Build documentation (strict)
        run: mkdocs build --strict
      - name: Run lab tests offline
        working-directory: lab
        run: |
          cp .env.example .env
          npm test
